format = "orbitweaver.config"
format_version = "1.0.0"

[physics]
model = "newtonian_two_body_kepler"
intent = "science"
note = "Twelve inclined ellipses. Seed 42 makes every element traceable from this file. Shared spacing is not a stability claim."

[epoch]
iso = "2000-01-01T12:00:00"
scale = "tt"

[central_body]
preset = "earth"

[array]
seed = 42
id_prefix = "ELL"
min_initial_separation_m = 10000.0
max_placement_attempts = 40

[[shells]]
name = "inclined_ellipses"
kind = "shell"
count = 12
group = "elliptical_shell"
body_radius_m = 5.0
a_m = { min = 8000000.0, max = 12000000.0 }
e = { min = 0.05, max = 0.35 }
inclination = { mode = "range", min_deg = 15.0, max_deg = 75.0 }
raan = { mode = "uniform" }
argp = { mode = "uniform" }
mean_anomaly = { mode = "phased", jitter_deg = 1.0 }
rendering = { role = "habitat_module", color = "#8fb8c9" }
