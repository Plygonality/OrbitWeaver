format = "orbitweaver.config"
format_version = "1.0.0"

[physics]
model = "newtonian_two_body_kepler"
intent = "science"
note = "Independently orbiting lightweight collectors on a Sun-centred shell. Isotropic inclination is uniform on the sphere. Rendering scale is not part of this file."

[epoch]
iso = "2000-01-01T12:00:00"
scale = "tt"

[central_body]
preset = "sun"

[array]
seed = 161803398
id_prefix = "COL"
min_initial_separation_m = 1000000000.0
max_placement_attempts = 8

[[shells]]
name = "collectors"
kind = "shell"
count = 1000
group = "collectors"
body_radius_m = 25.0
a_m = { min = "0.98 AU", max = "1.02 AU" }
e = { min = 0.0, max = 0.02 }
inclination = { mode = "isotropic" }
raan = { mode = "uniform" }
argp = { mode = "uniform" }
mean_anomaly = { mode = "uniform" }
rendering = { role = "collector", color = "#d7c39a" }
