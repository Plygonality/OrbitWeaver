[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitweaver"
version = "0.1.0"
description = "Newtonian Keplerian orbital-array designer, screening tool, and Blender preview bridge."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Plygonality"}]
keywords = ["astrodynamics", "kepler", "satellites", "dyson-swarm", "blender"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6",
]

[project.optional-dependencies]
rebound = ["rebound>=4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
orbitweaver = "orbitweaver.cli:main"

[project.urls]
Homepage = "https://github.com/Plygonality/OrbitWeaver"
Documentation = "https://github.com/Plygonality/OrbitWeaver/blob/main/docs/physics.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
